services:
  apexpay-db:
    image: postgres:15-alpine
    container_name: apexpay-postgres-container
    environment:
      POSTGRES_USER: admin_apexpay
      POSTGRES_PASSWORD: secure_bank_password123
      POSTGRES_DB: apexpay_finance
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - apexpay-network

  apexpay-broker:
    image: rabbitmq:3-management-alpine
    container_name: apexpay-rabbitmq-container
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - apexpay-network

volumes:
  postgres_data:

networks:
  apexpay-network:
    driver: bridge